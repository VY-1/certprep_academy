canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: src/backend/main.mo
        candid: src/backend/dist/backend.did
  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.0"
      configuration:
        build:
          - pnpm --dir src/frontend build
          - rm -rf dist && cp -R src/frontend/dist dist
        dir: dist
